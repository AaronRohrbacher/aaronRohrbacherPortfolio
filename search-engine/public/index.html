<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #222;
      line-height: 1.6;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 60px 20px 40px; }

    h1 { font-size: 2rem; font-weight: 300; margin-bottom: 24px; color: #333; }

    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }

    .search-bar input {
      flex: 1; padding: 12px 16px; font-size: 16px;
      border: 2px solid #ddd; border-radius: 8px; outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: #666; }

    .search-bar button {
      padding: 12px 24px; font-size: 16px; border: none;
      border-radius: 8px; cursor: pointer; font-weight: 500;
    }
    #search-btn { background: #333; color: #fff; }
    #search-btn:hover { background: #555; }
    #stop-btn { background: #c33; color: #fff; display: none; }

    .settings { margin-bottom: 20px; }
    .settings summary { cursor: pointer; color: #666; font-size: 14px; user-select: none; }

    .settings-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-top: 12px; padding: 16px; background: #fff;
      border-radius: 8px; border: 1px solid #eee;
    }
    .settings-grid label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    .settings-grid input, .settings-grid textarea {
      width: 100%; padding: 8px; font-size: 14px;
      border: 1px solid #ddd; border-radius: 4px; font-family: inherit;
    }
    .full-width { grid-column: 1 / -1; }

    #status { font-size: 13px; color: #888; margin-bottom: 16px; min-height: 20px; }

    .result { padding: 16px 0; border-bottom: 1px solid #eee; }
    .result-url { font-size: 13px; color: #0a0; word-break: break-all; }
    .result-title {
      font-size: 18px; color: #1a0dab; text-decoration: none; display: block; margin: 2px 0;
    }
    .result-title:hover { text-decoration: underline; }
    .result-snippet { font-size: 14px; color: #555; }
    .result-snippet mark { background: #fff3cd; padding: 0 2px; border-radius: 2px; }
    .result-score { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Search</h1>

    <div class="search-bar">
      <input type="text" id="query" placeholder="Search the web..." autofocus>
      <button id="search-btn">Search</button>
      <button id="stop-btn">Stop</button>
    </div>

    <details class="settings">
      <summary>Settings</summary>
      <div class="settings-grid">
        <div>
          <label>Max pages</label>
          <input type="number" id="max-pages" value="100" min="10" max="1000">
        </div>
        <div>
          <label>Max depth</label>
          <input type="number" id="max-depth" value="2" min="1" max="5">
        </div>
        <div>
          <label>Concurrency</label>
          <input type="number" id="concurrency" value="6" min="1" max="20">
        </div>
        <div>
          <label>Min score</label>
          <input type="number" id="min-score" value="1" min="0" step="0.5">
        </div>
        <div class="full-width">
          <label>Seed URLs (one per line — use {q} for query)</label>
          <textarea id="seeds" rows="3">https://en.wikipedia.org/w/index.php?search={q}&amp;fulltext=1
https://wiby.me/?q={q}</textarea>
        </div>
      </div>
    </details>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script src="engine.js"></script>
  <script>
    const $ = (s) => document.getElementById(s);
    let engine = null;
    let results = [];

    function esc(s) {
      return s.replace(/[<>&"]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));
    }

    function highlight(text, query) {
      let html = esc(text);
      const terms = query.toLowerCase().split(/\W+/).filter(t => t.length > 2);
      for (const t of terms) {
        html = html.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
      }
      return html;
    }

    function render() {
      results.sort((a, b) => b.score - a.score);
      $('results').innerHTML = results.map(r => `
        <div class="result">
          <div class="result-url">${esc(r.url)}</div>
          <a class="result-title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
          <div class="result-snippet">${highlight(r.snippet, $('query').value)}</div>
          <div class="result-score">relevance ${r.score}</div>
        </div>
      `).join('');
    }

    async function doSearch() {
      const query = $('query').value.trim();
      if (!query) return;

      results = [];
      $('results').innerHTML = '';
      $('status').textContent = 'Starting...';

      const seeds = $('seeds').value.trim().split('\n')
        .filter(Boolean)
        .map(s => s.replace(/\{q\}/g, encodeURIComponent(query)));

      const minScore = parseFloat($('min-score').value) || 1;

      engine = new SearchEngine({
        concurrency: parseInt($('concurrency').value) || 6,
        maxPages: parseInt($('max-pages').value) || 100,
        maxDepth: parseInt($('max-depth').value) || 2,

        onResult(r) {
          if (r.score < minScore) return;
          const dominated = results.findIndex(
            x => x.url === r.url || (new URL(x.url).hostname === new URL(r.url).hostname && x.title === r.title)
          );
          if (dominated !== -1) {
            if (r.score > results[dominated].score) results[dominated] = r; else return;
          } else {
            results.push(r);
          }
          render();
        },

        onStatus({ crawled, found, queued, active }) {
          $('status').textContent = `Crawled ${crawled} · Found ${found} · Queue ${queued} · Active ${active}`;
        },

        onDone({ crawled, found }) {
          $('status').textContent = `Done — crawled ${crawled} pages, found ${found} results.`;
          $('search-btn').style.display = '';
          $('stop-btn').style.display = 'none';
        },
      });

      $('search-btn').style.display = 'none';
      $('stop-btn').style.display = '';

      await engine.search(query, seeds);
    }

    $('search-btn').addEventListener('click', doSearch);
    $('query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    $('stop-btn').addEventListener('click', () => {
      engine?.stop();
      $('search-btn').style.display = '';
      $('stop-btn').style.display = 'none';
    });
  </script>
</body>
</html>
